[project]
name = "tb_trigger"
version = "0.1.0"
description = "Demonstration TB model with prevalence-triggered interventions in summer4"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Monash EMU" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tb_trigger"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["notebooks: execute every notebook under notebooks/"]
